      - tensorflow 
      - keras
      - medmnist
      - tensorpack
      - torchdiffeq
      - torchpack
      - qiskit==0.46.3
      - qiskit-terra==0.46.3
      - qiskit-aer==0.13.3
      - qiskit-ibm-provider==0.11.0
      - qiskit-ibm-runtime==0.20.0
      - dill
      - opt_einsum
      - pathos
      - pylatexenc
      - pyscf
      - requests
      - requests-ntlm
      - websocket-client
