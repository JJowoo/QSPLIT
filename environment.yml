name: QSPLIT
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy<2.0
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.5
  - scikit-image
  - matplotlib>=3.8
  - h5py
  - pytorch=2.5
  - torchvision=0.20
  - pytorch-cuda=12.1
  - pip:
      - fastapi==0.128.0
      - uvicorn==0.40.0
      - python-multipart
      - loguru
      - tqdm
